<section class="">
  <app-header [title]="'Doctor Notes'"></app-header>

    <section class="p-5">

    <ul class="flex items-center gap-2 mb-5">
      <li *ngFor="let category of radiologyCategories" (click)="handleCategories(category.name)"
      class="cursor-pointer px-3 py-1 font-semibold rounded-lg duration-300" [ngClass]="category.active ? 'bg-blue-500 text-white' : 'bg-neutral-200'">{{ category.name }}</li>
    </ul>

    <h1 class="font-bold text-2xl mb-2">Recent Notes</h1>
    <ul class="flex flex-col gap-1">
      <li *ngFor="let test of activeRecentNotes" class="bg-neutral-100 duration-300 hover:bg-neutral-200 rounded-lg p-2 flex justify-between items-center">
        <p class="font-semibold flex flex-col ">
          <span class="text-lg">{{ test.title }}</span>
          <span class="text-neutral-500">{{ test.doctor }}</span>
          <span class="text-neutral-500">{{ test.time }}</span>
        </p>
      </li>
    </ul>

    <h1 class="font-bold text-2xl mb-2 mt-5">Older Notes</h1>
    <ul class="flex flex-col gap-1">
      <li *ngFor="let test of activeOlderNotes" class="bg-neutral-100 duration-300 hover:bg-neutral-200 rounded-lg p-2 flex justify-between items-center">
        <p class="font-semibold flex flex-col ">
          <span class="text-lg">{{ test.title }}</span>
          <span class="text-neutral-500">{{ test.doctor }}</span>
          <span class="text-neutral-500">{{ test.time }}</span>
        </p>
      </li>
    </ul>

  </section>

</section>
