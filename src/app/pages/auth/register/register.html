<div class="min-h-screen w-full flex flex-col p-4 md:p-6 items-center justify-center bg-[radial-gradient(226.67%_104.68%_at_0%_0%,#54DEF9_6.26%,#00B4D8_47.92%,#0092E9_81.98%,#0450C1_95.15%)]">
  <!-- Form Card -->
  <div class="w-full max-w-full md:container md:px-0 md:mx-auto">
    <div class="flex flex-col rounded-3xl px-6 py-8 md:px-8 md:py-11 bg-white md:bg-white">
      <div class="flex flex-col gap-6 md:gap-8.75">
        <div class="flex flex-col gap-6 md:gap-7.5 md:px-8">
          <!-- Welcome Message -->
          <div class="flex flex-col items-start gap-1 md:gap-0.5 mb-6 md:mb-8">
            <p class="font-bold text-2xl md:text-[30px] leading-snug md:leading-[1.3] tracking-tight md:tracking-[-0.01em]">
              Hello!
            </p>
            <p class="font-semibold text-xl md:text-[25px] leading-snug md:leading-[1.3] tracking-tight md:tracking-[-0.01em] text-gray-600 md:text-current">
              Register to get started
            </p>
          </div>

          <!-- Form Inputs -->
          <form action="" method="" class="flex flex-col gap-4 md:gap-2.25 items-center justify-center">
            <input
              type="text"
              name="username"
              id="username"
              class="block rounded-xl px-4 py-4 md:px-7 md:py-5 bg-[#F7F8F9] duration-300 border border-transparent focus:border-black/25 focus:bg-black/10 outline-none w-full md:w-147.25"
              placeholder="username"
              required
            />
            <input
              type="email"
              name="mail"
              id="mail"
              class="block rounded-xl px-4 py-4 md:px-7 md:py-5 bg-[#F7F8F9] duration-300 border border-transparent focus:border-black/25 focus:bg-black/10 outline-none w-full md:w-147.25"
              placeholder="Enter your email"
              required
            />
            <input
              type="password"
              name="password"
              id="password"
              class="block rounded-xl px-4 py-4 md:px-7 md:py-5 bg-[#F7F8F9] duration-300 border border-transparent focus:border-black/25 focus:bg-black/10 outline-none w-full md:w-147.25"
              placeholder="password"
              required
            />
            <input
              type="password"
              name="password"
              id="password"
              class="block rounded-xl px-4 py-4 md:px-7 md:py-5 bg-[#F7F8F9] duration-300 border border-transparent focus:border-black/25 focus:bg-black/10 outline-none w-full md:w-147.25"
              placeholder="Confirmed password"
              required
            />
            <a href=""
              class="block text-[#6A707C] font-semibold text-sm md:text-[14px] leading-1 text-right mt-2 md:mt-3 w-full md:w-147.25"
              >Forget Password?</a
            >
            <button
              type="submit"
              class="flex flex-col justify-center items-center cursor-pointer rounded-xl bg-[#007BFF] shadow-md shadow-blue-500/25 text-white px-6 py-4 md:px-8 md:py-5 mt-6 md:mt-8 font-medium text-lg md:text-xl text-center w-full md:w-82.75 duration-300 hover:shadow-blue-500/50 hover:shadow-lg"
            >
              Sign Up
            </button>
          </form>
        </div>

        <!-- Social Media -->
        <div class="flex flex-col gap-5 md:gap-5.5 justify-center items-center">
          <!-- Or Separator -->
          <div class="flex flex-row items-center w-full md:w-auto gap-2 md:gap-3">
            <span class="block flex-1 md:flex-none border border-black md:w-28"></span>
            <span class="block font-semibold text-sm md:text-[15px] leading-1 tracking-normal px-2"
              >Or Login with</span
            >
            <span class="block flex-1 md:flex-none border border-black md:w-28"></span>
          </div>
          <!-- Social Media Icons -->
          <div class="flex flex-row gap-3 md:gap-2 justify-center items-center w-full md:w-auto">
            <a href="https://www.facebook.com" target="_blank" class="flex flex-1 md:flex-none justify-center rounded-lg items-center bg-[#F7F8F9] py-3 md:py-5 md:w-26.25">
              <img src="facebook-ic.png" alt="facebook icon"/>
            </a>
            <a href="https://www.google.com" target="_blank" class="flex flex-1 md:flex-none justify-center rounded-lg items-center bg-[#F7F8F9] py-3 md:py-5 md:w-26.25">
              <img src="google-ic.png" alt="google icon"/>
            </a>
            <a href="https://www.apple.com" target="_blank" class="flex flex-1 md:flex-none justify-center rounded-lg items-center bg-[#F7F8F9] py-3 md:py-5 md:w-26.25">
              <img src="apple-ic.png" alt="apple icon"/>
            </a>
          </div>
          <!-- Register Now -->
          <div class="flex flex-row gap-1 justify-center items-center">
            <span class="font-medium text-sm md:text-[15px] leading-[1.4] tracking-[1%] text-[#1E232C]">Already have an account?</span>
            <a routerLink="/login" class="font-semibold text-[#74B6FD] text-sm md:text-[15px] leading-[1.4] tracking-[1%]">Login Now</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
